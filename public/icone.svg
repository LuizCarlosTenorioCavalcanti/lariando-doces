<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'>
<!-- Tem um gêmeo: public/icone-180.png, que é o que o iPhone usa na tela inicial (o iOS
     ignora SVG ali). Ele é este mesmo desenho SEM canto arredondado e SEM transparência,
     porque o iOS aplica a própria máscara e canto transparente vira canto preto. Mudou a
     cor ou as letras aqui? Regere o PNG: fundo #8c3b5e sangrando, "LD" em #fdf7f4, negrito,
     centralizado, corpo 105px em 180x180. -->
<rect width='512' height='512' rx='96' fill='#8c3b5e'/>
<text x='50%' y='58%' font-family='system-ui,sans-serif' font-size='300' font-weight='700'
 fill='#fdf7f4' text-anchor='middle' dominant-baseline='middle'>LD</text></svg>